name: Update Intents Documentation

on:
  repository_dispatch:
    types: [update-intents]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-intents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout valu-docs
        uses: actions/checkout@v4
        with:
          path: valu-docs

      - name: Checkout valusocial-web
        uses: actions/checkout@v4
        with:
          repository: Roomful/valusocial-web
          token: ${{ secrets.VALUSOCIAL_WEB_READ_TOKEN }}
          path: valusocial-web

      # Public; supplies the parity facts (what also runs on the server) for
      # the Explorer's Server Intents page.
      - name: Checkout valu-api
        uses: actions/checkout@v4
        with:
          repository: Roomful/valu-api
          path: valu-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate intents documentation
        run: node scripts/generate-intent-docs.js ./output/intents.md
        working-directory: valusocial-web

      - name: Copy generated docs
        run: cp valusocial-web/output/intents.md valu-docs/docs/intents-doc.md

      # Reads ../valusocial-web and ../valu-api, the checkouts above.
      - name: Generate Explorer catalogues
        run: node scripts/build-explorer-catalogue.mjs
        working-directory: valu-docs

      - name: Commit and push
        working-directory: valu-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/intents-doc.md docs/.vitepress/explorer/intents.json docs/.vitepress/explorer/server-intents.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update intents reference"
          git push
