name: Update Intents Documentation

on:
  repository_dispatch:
    types: [update-intents]
  workflow_dispatch:

jobs:
  update-intents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout valu-docs
        uses: actions/checkout@v4
        with:
          path: valu-docs

      - name: Checkout valusocial-web
        uses: actions/checkout@v4
        with:
          repository: Roomful/valusocial-web
          token: ${{ secrets.GITHUB_TOKEN }}
          path: valusocial-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate intents documentation
        run: node scripts/generate-intent-docs.js ./output/intents.md
        working-directory: valusocial-web

      - name: Copy generated docs
        run: cp valusocial-web/output/intents.md valu-docs/docs/intents-doc.md

      - name: Commit and push
        working-directory: valu-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/intents-doc.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update intents reference"
          git push
