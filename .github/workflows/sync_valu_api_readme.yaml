name: Sync Valu API README

on:
  repository_dispatch:
    types: [update-valu-api-docs]
  workflow_dispatch:

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout valu-docs
        uses: actions/checkout@v4
        with:
          path: valu-docs

      - name: Checkout valu-api
        uses: actions/checkout@v4
        with:
          repository: Roomful/valu-api
          token: ${{ secrets.GITHUB_TOKEN }}
          path: valu-api

      - name: Copy README to docs
        run: cp valu-api/README.md valu-docs/docs/valu-api.md

      - name: Commit and push
        working-directory: valu-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/valu-api.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: sync valu-api README"
          git push
