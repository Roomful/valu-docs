name: Sync Valu Package Docs

on:
  repository_dispatch:
    types: [update-valu-api-docs]
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout valu-docs
        uses: actions/checkout@v4
        with:
          path: valu-docs

      - name: Checkout valu-api
        uses: actions/checkout@v4
        with:
          repository: Roomful/valu-api
          path: valu-api

      # valu-routing.md lives in valu-api (there is no valu-routing repository).
      # The script also points the README's relative links at GitHub, because
      # VitePress fails the deploy on a dead link.
      - name: Copy docs
        run: node valu-docs/scripts/sync-valu-api-docs.mjs valu-api

      - name: Commit and push
        working-directory: valu-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/valu-api.md docs/valu-routing.md docs/valu-api-functions.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: sync valu-api and valu-routing READMEs"
          git push
