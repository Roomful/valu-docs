name: Sync Valu Package Docs

on:
  repository_dispatch:
    types: [update-valu-api-docs, update-valu-routing-docs]
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout valu-docs
        uses: actions/checkout@v4
        with:
          path: valu-docs

      - name: Checkout valu-api
        uses: actions/checkout@v4
        with:
          repository: Roomful/valu-api
          token: ${{ secrets.GITHUB_TOKEN }}
          path: valu-api

      - name: Checkout valu-routing
        uses: actions/checkout@v4
        with:
          repository: Roomful/valu-routing
          token: ${{ secrets.GITHUB_TOKEN }}
          path: valu-routing

      - name: Copy docs
        run: |
          cp valu-api/README.md valu-docs/docs/valu-api.md
          cp valu-routing/README.md valu-docs/docs/valu-routing.md

      - name: Commit and push
        working-directory: valu-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/valu-api.md docs/valu-routing.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: sync valu-api and valu-routing READMEs"
          git push
